upstream ponthe {
    server back:8000;
}

server {
    listen 80;

    location / {
        proxy_pass http://ponthe;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $http_host;
        proxy_redirect off;
        client_max_body_size 2G;
        proxy_read_timeout 60;
    }

    location /static/ {
        alias /src/static/;
    }

    # Reached only through X-Accel-Redirect, once Django has checked the access
    # rights. Limited to the media folder: the rest of /src is the backend code.
    location /protected/ {
        internal;
        alias /src/media/;
    }

    # API requests only carry small JSON bodies. The block used to read
    # `location /api/*`: nginx takes the star literally, so it matched nothing
    # and every API route accepted the 2G meant for zip uploads.
    location /api/ {
        proxy_pass http://ponthe;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $http_host;
        proxy_redirect off;
        client_max_body_size 3m;
    }

    # The zip of a selection of pictures is written by a backend worker as it
    # reads them from the disk. nginx takes it whole, into a temporary file,
    # and the visitor fetches it from there at their own pace. Left at its
    # default of 1G, nginx would stop there and a slow connection would hold
    # the worker until gunicorn kills it, cutting the archive short. Has to
    # stay above DOWNLOAD_MAX_BYTES (settings.py). In megabytes: unlike
    # client_max_body_size, this directive does not understand "g".
    location /api/gallery/pics/download/ {
        proxy_pass http://ponthe;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $http_host;
        proxy_redirect off;
        client_max_body_size 3m;
        proxy_max_temp_file_size 5120m;
    }
}